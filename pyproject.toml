[project]
name = "music-splitter"
version = "0.1.0"
description = "Vocal harmony separation using SepReformer"
requires-python = ">=3.11"
dependencies = [
    "jax[cuda12]>=0.4.30",
    "equinox>=0.11.0",
    "optax>=0.2.0",
    "jaxtyping>=0.2.28",
    "soundfile>=0.12.1",
    "librosa>=0.10.0",
    "numpy>=1.26",
    "tensorboardX>=2.6",
    "tqdm>=4.66",
    "beartype>=0.18.0",
    "hf>=1.10.1,<2",
    "acappella-info",
    "pytest>=8.0",
    "yt-dlp[default]>=2026.3.17,<2027",
    "grain>=0.2.16,<0.3",
    "tensorboard>=2.20.0",
    "setuptools<82",
    "fire>=0.7.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
miller = ">=6.17.0,<7"
unzip = ">=6.0,<7"
ffmpeg = ">=8.0.1,<9"
deno = ">=2.3.4,<2.4"

[tool.pixi.activation]
scripts = ["secrets.sh"]
